<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | EchoLearn</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #0f172a;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #3b82f6;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .btn {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }

    .profile-dropdown {
      position: relative;
    }

    .profile-icon {
      width: 38px;
      height: 38px;
      background-color: #3b82f6;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      z-index: 1000;
      min-width: 140px;
    }

    .dropdown-content a {
      display: block;
      padding: 10px;
      color: white;
      text-decoration: none;
    }

    .dropdown-content a:hover {
      background-color: #334155;
    }

    .dashboard-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .match-box {
      background: #15163D;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .match-box h2 {
      text-align: center;
    }

    .match-box p {
      text-align: center;
      margin-bottom: 2rem;
    }

    form label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    form select,
    form input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    form button {
      margin-top: 1.5rem;
      padding: 10px;
      background: linear-gradient(to right, #00c6ff, #00ff99);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    #matchResult {
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">EchoLearn</div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <div class="profile-dropdown">
        <div class="profile-icon" onclick="toggleDropdown()">P</div>
        <div class="dropdown-content" id="dropdownMenu">
          <a href="profile.html">View Profile</a>
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="match-box">
      <h2>Find a Match</h2>
      <p>Select skills from your profile to find the best match.</p>

      <form id="matchForm">
        <label for="skillsHave">Skills You Can Teach</label>
        <select id="skillsHave" name="skillsHave" multiple style="height: 80px;"></select>

        <label for="skillsWant">Skills You Want to Learn</label>
        <input id="skillsWant" name="skillsWant" type="text" placeholder="e.g. french, photoshop" />

        <button type="submit">Find Match</button>
      </form>

      <div id="matchResult"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script>
    function toggleDropdown() {
      const menu = document.getElementById("dropdownMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // Close dropdown if clicking outside
    window.addEventListener('click', function (e) {
      if (!e.target.closest('.profile-dropdown')) {
        document.getElementById("dropdownMenu").style.display = "none";
      }
    });
  </script>

</body>
</html>
